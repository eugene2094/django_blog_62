{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Login into your account</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <p class="mt-3">Have no account ?<a href="{% url 'blog:register' %}">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
